sentence=ESP32-P4 DSI Display with 480x480 LVGL buffer and PPA scaling to 720x720
paragraph=Library for ESP32-P4 MIPI DSI displays. LVGL renders into a 480x480 draw buffer which is PPA-scaled to 720x720 DMA framebuffers for display output. Uses custom DPI panel driver with DMA chain manipulation for framebuffer switching. The board (Waveshare ESP32-P4-86-Panel-ETH-2RO) has 32MB flash and 32MB PSRAM; both PSRAM and Flash Size=32MB must be selected in Tools.
